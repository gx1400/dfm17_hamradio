version: 2
updates:
  # GitHub Actions in .github/workflows, pinned to commit SHAs with the
  # version in a comment; Dependabot updates both
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # wait a week after a release before proposing it: a compromised version
    # is usually caught and pulled within days
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Python packages for the tools and CI (tools/requirements.txt, the lint
  # tools in tools/requirements-lint.txt, the settings tools and app in
  # tools/requirements-config.txt and tools/requirements-app.txt)
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  # Not covered by Dependabot: the Ubuntu packages CI installs with apt
  # (gcc-arm-none-eabi, direwolf, cppcheck), and the STM32 HAL/CMSIS sources vendored in
  # dfm17/Drivers, which come from STM32CubeMX.
