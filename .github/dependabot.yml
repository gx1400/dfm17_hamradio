version: 2
updates:
  # GitHub Actions in .github/workflows, pinned to commit SHAs with the
  # version in a comment; Dependabot updates both
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python packages for the tools and CI (tools/requirements.txt)
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Not covered by Dependabot: the Ubuntu packages CI installs with apt
  # (gcc-arm-none-eabi, direwolf), and the STM32 HAL/CMSIS sources vendored in
  # dfm17/Drivers, which come from STM32CubeMX.
