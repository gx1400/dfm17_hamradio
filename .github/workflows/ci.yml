name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# read-only token everywhere; no job pushes, comments or publishes
permissions:
  contents: read

# a newer push to the same PR cancels the older run; runs on main always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firmware:
    name: Firmware build (all variants)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the size report builds the base commit too
          persist-credentials: false
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build every variant (tracker, fox, hw_survey, rf_test, nfc_tool)
        run: make firmware
      - name: Build the base commit for the size comparison
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if base=$(git merge-base "${BASE:-HEAD~1}" HEAD 2>/dev/null) \
              && git worktree add --detach ../base "$base" \
              && make -C ../base firmware >/dev/null; then
            echo "SIZE_BASE=../base/build" >> "$GITHUB_ENV"
            echo "SIZE_BASE_LABEL=$(git log -1 --format='%h %s' "$base")" >> "$GITHUB_ENV"
          else
            echo "::notice title=Firmware size::no base build, reporting this build only"
          fi
      - name: Firmware size, budget and soft-double check
        run: |
          python3 tools/size/size_report.py --head build \
            ${SIZE_BASE:+--base "$SIZE_BASE" --base-label "$SIZE_BASE_LABEL"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dfm17-firmware
          path: |
            build/*/dfm17.elf
            build/*/dfm17.hex
            build/*/dfm17.bin
            build/*/dfm17.map

  host-tests:
    name: Host tests and APRS decoding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make direwolf
          pip install -r tools/requirements.txt
      - name: Unit tests (firmware sources against a fake HAL)
        run: make -C tools/tests
      - name: APRS packets decode with Dire Wolf
        run: make -C tools/aprs_sim check
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: tools/tests/build/*.log

  lint:
    name: Lint and format checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the format check compares with the base commit
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-lint.txt
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          pip install -r tools/requirements-lint.txt
      - name: Line endings (CubeMX files CRLF, the rest LF)
        run: tools/lint/check_eol.sh
      - name: cppcheck (dfm17/Core)
        run: tools/lint/cppcheck.sh
      - name: clang-format (changed C lines only)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: tools/lint/format.sh check "${BASE:-HEAD~1}"
      - name: ruff (Python tools)
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x -P SCRIPTDIR -P .
      - name: actionlint
        run: actionlint
      - name: zizmor (workflow and Dependabot security)
        env:
          GH_TOKEN: ${{ github.token }} # read-only; enables the online audits
        run: zizmor --format github .github/
