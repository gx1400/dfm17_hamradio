name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Firmware build (all variants)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build tracker, fox, hw_survey and rf_test
        run: make firmware
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dfm17-firmware
          path: |
            build/*/dfm17.elf
            build/*/dfm17.hex
            build/*/dfm17.bin
            build/*/dfm17.map

  host-tests:
    name: Host tests and APRS decoding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make python3-numpy python3-scipy direwolf
      - name: Unit tests (firmware sources against a fake HAL)
        run: make -C tools/tests
      - name: APRS packets decode with Dire Wolf
        run: make -C tools/aprs_sim check
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: tools/tests/build/*.log
