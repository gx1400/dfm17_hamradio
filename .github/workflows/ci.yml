name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# read-only token everywhere; no job pushes, comments or publishes
permissions:
  contents: read

# a newer push to the same PR cancels the older run; runs on main always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firmware:
    name: Firmware build (all variants)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the size report builds the base commit too
          persist-credentials: false
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build every variant (tracker, fox, hw_survey, rf_test, nfc_tool)
        run: make firmware
      - name: SWD descriptor in each build matches the settings tools
        run: for elf in build/*/dfm17.elf; do python3 tools/config/dfmcfg.py --check-elf "$elf"; done
      - name: Build the base commit for the size comparison
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if base=$(git merge-base "${BASE:-HEAD~1}" HEAD 2>/dev/null) \
              && git worktree add --detach ../base "$base" \
              && make -C ../base firmware >/dev/null; then
            echo "SIZE_BASE=../base/build" >> "$GITHUB_ENV"
            echo "SIZE_BASE_LABEL=$(git log -1 --format='%h %s' "$base")" >> "$GITHUB_ENV"
          else
            echo "::notice title=Firmware size::no base build, reporting this build only"
          fi
      - name: Firmware size, budget and soft-double check
        run: |
          python3 tools/size/size_report.py --head build --markdown size-report.md \
            ${SIZE_BASE:+--base "$SIZE_BASE" --base-label "$SIZE_BASE_LABEL"}
      - name: Keep the size report for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-size-report
          path: size-report.md
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dfm17-firmware
          path: |
            build/*/dfm17.elf
            build/*/dfm17.hex
            build/*/dfm17.bin
            build/*/dfm17.map

  host-tests:
    name: Host tests and APRS decoding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make direwolf xvfb
          pip install -r tools/requirements.txt
      - name: Unit tests (firmware sources against a fake HAL)
        run: make -C tools/tests
      - name: APRS packets decode with Dire Wolf
        run: make -C tools/aprs_sim check
      - name: Settings GUI against a simulated board
        run: xvfb-run -a python3 tools/config/test_dfmgui.py
      - name: Coverage of the firmware sources by the host tests
        run: |
          make -C tools/tests coverage
          cat tools/tests/build-cov/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage report (HTML)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: tools/tests/build-cov/html/
      - name: Keep the coverage table for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-coverage-report
          path: tools/tests/build-cov/coverage.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: tools/tests/build/*.log

  lint:
    name: Lint and format checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the format check compares with the base commit
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-lint.txt
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          pip install -r tools/requirements-lint.txt
      - name: Line endings (CubeMX files CRLF, the rest LF)
        run: tools/lint/check_eol.sh
      - name: cppcheck (dfm17/Core)
        run: tools/lint/cppcheck.sh
      - name: clang-format (changed C lines only)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: tools/lint/format.sh check "${BASE:-HEAD~1}"
      - name: ruff (Python tools)
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x -P SCRIPTDIR -P .
      - name: actionlint
        run: actionlint
      - name: zizmor (workflow and Dependabot security)
        env:
          GH_TOKEN: ${{ github.token }} # read-only; enables the online audits
        run: zizmor --format github .github/

  # One comment per PR with the job results, the size report and the coverage
  # table, edited in place on every new push or re-run. Only this job can
  # write to the PR. PRs from forks get a read-only token, so they get no
  # comment (their results are in the job summaries); a workflow_run-based
  # commenter could do it, but would run with write access next to output
  # from untrusted code.
  pr-report:
    name: PR report comment
    needs: [firmware, host-tests, lint]
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write # create or update the report comment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pr-*-report
          path: reports
          merge-multiple: true
      - name: Post or update the report comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FIRMWARE: ${{ needs.firmware.result }}
          TESTS: ${{ needs.host-tests.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          marker='<!-- dfm17-ci-report -->'
          icon() {
            case "$1" in
            success) echo "✅" ;; failure) echo "❌" ;; cancelled) echo "⏹️" ;; *) echo "➖" ;;
            esac
          }
          # the reports' own headings, demoted to fit a comment
          demote() { sed -e 's/^# /#### /' -e 's/^## /#### /' "$1"; }
          {
            echo "$marker"
            echo "### CI report for ${SHA:0:7}"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Firmware build (all variants) | $(icon "$FIRMWARE") $FIRMWARE |"
            echo "| Host tests and APRS decoding | $(icon "$TESTS") $TESTS |"
            echo "| Lint and format checks | $(icon "$LINT") $LINT |"
            echo
            if [ -f reports/size-report.md ]; then
              demote reports/size-report.md
            else
              echo "_No size report: the firmware build stopped before it._"
            fi
            echo
            if [ -f reports/coverage.md ]; then
              echo "<details><summary>Host test coverage</summary>"
              echo
              demote reports/coverage.md
              echo
              echo "</details>"
            else
              echo "_No coverage report: the host tests stopped before it._"
            fi
            echo
            echo "[Full run]($RUN_URL). This comment is updated on every push."
          } > comment.md
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
            echo "updated comment $id"
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
            echo "posted a new comment"
          fi
